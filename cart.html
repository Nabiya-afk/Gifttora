<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Giftora | Your Shopping Cart</title>

   <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="cart-navbar">

    <a href="index.html" class="cart-logo">

        <img src="images/logo.png"
             alt="Giftora Logo">

    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Shop
        </a>

        <a href="about.html">
            About us
        </a>

        <a href="contact.html">
            Contact
        </a>

        <a href="login.html">
            Login
        </a>

        <a href="cart.html">
            🛒 Cart
        </a>

    </nav>

</header>



<!-- =========================
     CART TITLE
========================= -->

<section class="cart-title">

    <h1>
        Your Shopping Cart
    </h1>

    <p>
        Review your selected gifts before placing your order.
    </p>

</section>



<!-- =========================
     CART AREA
========================= -->

<section class="cart-area">


    <!-- LEFT SIDE -->

    <div class="cart-items-section">

        <h2>
            Cart Items
        </h2>


        <div id="cartItems"
             class="figma-cart-box">
        </div>


        <div id="emptyCart"
             class="figma-empty-cart">

            <p>
                Your cart is empty.
            </p>

            <a href="products.html">
                Continue Shopping
            </a>

        </div>

    </div>



    <!-- RIGHT SIDE -->

    <div class="summary-section">

        <h2>
            Order Summary
        </h2>


        <div class="summary-box">


            <div class="figma-summary-row">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    ₹0
                </span>

            </div>


            <div class="figma-summary-row">

                <span>
                    Shipping
                </span>

                <span id="shipping">
                    ₹50
                </span>

            </div>


            <hr>


            <div class="figma-total-row">

                <span>
                    Total
                </span>

                <span id="total">
                    ₹0
                </span>

            </div>


            <button
                id="proceedCheckout"
                class="figma-checkout-btn">

                Proceed To<br>
                CheckOut

            </button>

        </div>

    </div>

</section>



<!-- =========================
     CHECKOUT DETAILS
========================= -->

<section class="figma-checkout-details">

    <h2>
        CheckOut Details
    </h2>


    <form id="checkoutForm">


        <div class="checkout-field">

            <label>
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                required>

        </div>


        <div class="checkout-field">

            <label>
                Email Address
            </label>

            <input
                type="email"
                id="email"
                required>

        </div>


        <div class="checkout-field">

            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                required>

        </div>


        <div class="checkout-field">

            <label>
                Delivery Address
            </label>

            <input
                type="text"
                id="address"
                required>

        </div>


        <div class="checkout-field">

            <label>
                City
            </label>

            <input
                type="text"
                id="city"
                required>

        </div>


        <div class="checkout-field">

            <label>
                PinCode
            </label>

            <input
                type="text"
                id="pincode"
                required>

        </div>



        <!-- PAYMENT -->

        <div class="payment-method">

            <p>
                Payment Method
            </p>


            <label>

                <input
                    type="radio"
                    name="payment"
                    value="cod"
                    required>

                Cash on Delivery

            </label>


            <label>

                <input
                    type="radio"
                    name="payment"
                    value="online">

                Online Payment

            </label>

        </div>



        <button
            type="submit"
            class="place-order-btn">

            PLACE ORDER

        </button>


        <p id="orderMessage"
           class="order-message">
        </p>


    </form>

</section>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>


/* GET CART */

function getCart() {

    return JSON.parse(
        localStorage.getItem("giftoraCart")
    ) || [];

}



/* SAVE CART */

function saveCart(cart) {

    localStorage.setItem(
        "giftoraCart",
        JSON.stringify(cart)
    );

}



/* DISPLAY CART */

function displayCart() {

    const cart = getCart();

    const cartItems =
        document.getElementById("cartItems");

    const emptyCart =
        document.getElementById("emptyCart");


    cartItems.innerHTML = "";


    let subtotal = 0;


    if (cart.length === 0) {

        emptyCart.style.display = "block";

        document.getElementById("subtotal")
            .textContent = "₹0";

        document.getElementById("shipping")
            .textContent = "₹0";

        document.getElementById("total")
            .textContent = "₹0";

        return;

    }


    emptyCart.style.display = "none";


    cart.forEach(function(item, index) {

        subtotal +=
            item.price * item.quantity;


        const product =
            document.createElement("div");

        product.className =
            "figma-cart-item";


        product.innerHTML = `

            <div class="figma-product-image">

                <img src="${item.image}"
                     alt="${item.name}">

            </div>


            <div class="figma-product-info">

                <h3>
                    🎁 ${item.name}
                </h3>

                <p>
                    ₹${item.price}
                </p>


                <div class="quantity">

                    <span>
                        Quantity:
                    </span>


                    <button
                        onclick="changeQuantity(${index}, -1)">
                        -
                    </button>


                    <span class="quantity-number">
                        ${item.quantity}
                    </span>


                    <button
                        onclick="changeQuantity(${index}, 1)">
                        +
                    </button>

                </div>


                <button
                    class="remove-item"
                    onclick="removeItem(${index})">

                    Remove Item

                </button>

            </div>

        `;


        cartItems.appendChild(product);

    });


    document.getElementById("subtotal")
        .textContent = "₹" + subtotal;


    const shipping = 50;


    document.getElementById("shipping")
        .textContent = "₹" + shipping;


    document.getElementById("total")
        .textContent =
            "₹" + (subtotal + shipping);

}



/* CHANGE QUANTITY */

function changeQuantity(index, amount) {

    let cart = getCart();


    cart[index].quantity += amount;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart(cart);

    displayCart();

}



/* REMOVE ITEM */

function removeItem(index) {

    let cart = getCart();


    cart.splice(index, 1);


    saveCart(cart);

    displayCart();

}



/* PROCEED TO CHECKOUT */

document
    .getElementById("proceedCheckout")
    .addEventListener("click", function() {

        document
            .querySelector(".figma-checkout-details")
            .scrollIntoView({
                behavior: "smooth"
            });

    });



/* PLACE ORDER */

document
    .getElementById("checkoutForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const cart = getCart();


        if (cart.length === 0) {

            alert(
                "Please add a gift to your cart first."
            );

            return;

        }


        document
            .getElementById("orderMessage")
            .textContent =
            "Order placed successfully! 💗";


        localStorage.removeItem("giftoraCart");


        displayCart();

        this.reset();

    });



/* LOAD CART */

displayCart();


</script>


</body>

</html>
