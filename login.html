<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Giftora | Login</title>
   <link rel="stylesheet" href="style.css">
</head>


<body class="login-page">


    <!-- ================================
         LOGIN CONTAINER
    ================================= -->

    <main class="login-container">


        <!-- ================================
             LOGIN CARD
        ================================= -->

        <div class="login-card">


            <!-- LOGO -->

            <a href="index.html" class="login-logo">

                <img src="logo.png"
                     alt="Giftora Logo">

            </a>



            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="login-field">

                    <label for="email">
                        Email
                    </label>

                    <span>:</span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>



                <!-- PASSWORD -->

                <div class="login-field">

                    <label for="password">
                        Password
                    </label>

                    <span>:</span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>



                <!-- FORGOT PASSWORD -->

                <div class="forgot-password">

                    <a href="#">
                        Forgot Password
                    </a>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>



                <!-- REGISTER -->

                <div class="register-text">

                    <p>
                        Don't have an account?
                    </p>

                    <a href="#">
                        Register
                    </a>

                </div>


                <!-- MESSAGE -->

                <p id="loginMessage"
                   class="login-message">
                </p>


            </form>

        </div>

    </main>
    <script src="script.js"></script>
</body>
</html>
